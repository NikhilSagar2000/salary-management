# Own project name, so this app never reuses another "salary-management" volume.
name: acme-salary
services:
  db:
    image: postgres:17-alpine
    # Log the plan of any statement slower than 20 s (diagnostics for slow test runs).
    command: ["postgres", "-c", "shared_preload_libraries=auto_explain", "-c", "auto_explain.log_min_duration=20s"]
    environment:
      POSTGRES_USER: acme
      POSTGRES_PASSWORD: acme
      POSTGRES_DB: acme
    ports:
      - "4734:5432"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acme -d acme"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  pgdata:
